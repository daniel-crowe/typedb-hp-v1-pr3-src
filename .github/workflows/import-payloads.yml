name: import-payloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-payloads.yml
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch payloads
        run: |
          set -euo pipefail
          mkdir -p fonts-b64
          fetch() {
            local page="$1" dest="$2" expect="$3"
            html=$(curl -fsSL -A Mozilla/5.0 "$page")
            dl=$(printf '%s' "$html" | sed -n 's/.*class="download" href="\([^\"]*\)".*/\1/p' | head -n1)
            test -n "$dl"
            curl -fsSL -A Mozilla/5.0 "$dl" -o "$dest"
            got=$(sha256sum "$dest" | awk '{print $1}')
            test "$got" = "$expect"
          }
          fetch https://tmpfiles.org/wDwnkQmklW3F/darkmodeon-rg.ttf.b64 fonts-b64/DarkmodeOn-Rg.ttf.b64 9be46e4cc37efe698d2c26dfc6daaf30a9259fcad5aa474d76caa81451528479
          fetch https://tmpfiles.org/wVwvkom3l5Yu/darkmodeon-bd.ttf.b64 fonts-b64/DarkmodeOn-Bd.ttf.b64 374cb97f37bc51f672976cddfef47293f417cc626ef23f896bcf6ff6f266bda9
          fetch https://tmpfiles.org/wVwoklmHlU1S/darkmodeon-lt.ttf.b64 fonts-b64/DarkmodeOn-Lt.ttf.b64 84027ef6b8c60f890702ca55c06afbbe1e88857e9a66186ef7d71fe9591586c8
          fetch https://tmpfiles.org/w3wqktmclxuu/darkmodeon-md.ttf.b64 fonts-b64/DarkmodeOn-Md.ttf.b64 97ecddf42255cc04a256f691575fe232fb02e11fdbf968f2ca529a8df6f5da3e
          fetch https://tmpfiles.org/w4wxkrmzlz9v/darkmodeon-sbd.ttf.b64 fonts-b64/DarkmodeOn-SBd.ttf.b64 bc0242e99e8edcd4f287cb159766714913f6a8e30675ed0378bed3384c0b55fb
          fetch https://tmpfiles.org/wDwAkvmlllQa/darkmodeon-th.ttf.b64 fonts-b64/DarkmodeOn-Th.ttf.b64 575e16148025c3d51da419268940dc5b613708133fd8a895796342865e50ef9e
          fetch https://tmpfiles.org/wYwEkTmmlgzg/package-lock.json package-lock.json c58881c04d5f06988810d0a9c3577b410218588ad9392671165462cef0f1fe14
      - name: Commit payloads
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fonts-b64/*.b64 package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add font payloads and package-lock"
          git pull --rebase origin main
          git push
